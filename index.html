<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Variants</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4a9eff" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/klods-css@2.2.0/dist/klods.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="site-name" href="index.html">
          <!-- One knight for each theme: CSS shows the one that suits -->
          <img class="for-light" src="assets/pieces/black/knight.webp" alt="" />
          <img class="for-dark" src="assets/pieces/white/knight.webp" alt="" />
          Chess variants
        </a>
        <form id="join-form" class="join-form" aria-label="Join a game">
          <label class="visually-hidden" for="game-id-input">Game code</label>
          <input
            type="text"
            id="game-id-input"
            class="klods-input"
            placeholder="Game code"
            maxlength="8"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="btn-join" class="klods-button" type="submit">Join</button>
        </form>
      </header>

      <div id="error-message" class="klods-alert klods-alert--danger" role="alert" hidden></div>

      <!-- Folds away; while folded, the summary still says if a game is waiting for you -->
      <details id="your-games" class="klods-details your-games" open hidden>
        <summary>
          <span class="your-games__summary">
            <h2 class="your-games__title">Your games</h2>
            <span id="your-games-count" class="klods-badge"></span>
            <span id="your-games-waiting" class="klods-status klods-status--success" hidden></span>
          </span>
        </summary>
        <ul id="your-games-list" class="klods-list klods-list--flush"></ul>
      </details>

      <main class="lobby">
        <form id="new-game" class="klods-card new-game" aria-labelledby="new-game-title">
          <div class="klods-card__body new-game__body">
            <h1 id="new-game-title" class="klods-card__title">New game</h1>

            <fieldset class="variant-options">
              <legend class="klods-label">Variant</legend>
              <div id="variant-options" class="variant-options__list"></div>
            </fieldset>

            <div class="setup-row">
              <p id="opponent-label" class="klods-label">Play against</p>
              <div class="klods-segmented" role="radiogroup" aria-labelledby="opponent-label">
                <label class="klods-segmented__option"
                  ><input
                    type="radio"
                    class="klods-segmented__input"
                    name="opponent"
                    id="opponent-friend"
                    value="friend"
                    checked
                  />A friend</label
                >
                <label class="klods-segmented__option"
                  ><input
                    type="radio"
                    class="klods-segmented__input"
                    name="opponent"
                    id="opponent-bot"
                    value="bot"
                  />The bot</label
                >
              </div>
            </div>

            <div class="setup-row">
              <p id="colour-label" class="klods-label">Play as</p>
              <div class="klods-segmented" role="radiogroup" aria-labelledby="colour-label">
                <label class="klods-segmented__option"
                  ><input
                    type="radio"
                    class="klods-segmented__input"
                    name="colour"
                    id="color-white"
                    value="white"
                    checked
                  />White</label
                >
                <label class="klods-segmented__option"
                  ><input
                    type="radio"
                    class="klods-segmented__input"
                    name="colour"
                    id="color-black"
                    value="black"
                  />Black</label
                >
                <label class="klods-segmented__option"
                  ><input
                    type="radio"
                    class="klods-segmented__input"
                    name="colour"
                    id="color-random"
                    value="random"
                  />Random</label
                >
              </div>
            </div>

            <label class="klods-switch klods-switch--reverse">
              <input type="checkbox" class="klods-switch__input" id="chess960" />
              <span class="klods-switch__track"></span>
              <span class="klods-switch__label">Chess960 <span class="klods-muted">(shuffled back rank)</span></span>
            </label>

            <button id="btn-start" class="klods-button klods-button--primary new-game__start" type="submit">
              Start
            </button>
          </div>
        </form>

        <section id="rules" class="rules" aria-live="polite" aria-labelledby="rules-title">
          <p class="rules__eyebrow">How to play</p>
          <h2 id="rules-title" class="rules__title"></h2>
          <div id="rules-text" class="rules__text"></div>
          <img id="rules-screenshot" class="rules__screenshot" alt="" />
          <div id="rules-960" class="klods-alert klods-alert--info" hidden></div>
        </section>
      </main>

      <footer class="site-footer">
        <p class="site-footer__credit">
          Made by <a class="klods-link" href="https://www.druewilding.com/">Drue Wilding</a>
        </p>
        <div class="site-footer__theme">
          <p id="theme-label" class="klods-label">Theme</p>
          <div class="klods-segmented" role="radiogroup" aria-labelledby="theme-label">
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="auto" checked />Auto</label
            >
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="light" />Light</label
            >
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="dark" />Dark</label
            >
          </div>
        </div>
      </footer>
    </div>

    <script type="module">
      import { ChessEngine } from "./js/chess-engine.js";
      import { askToConfirm } from "./js/confirm.js";
      import {
        CHESS960_RULES,
        VARIANTS,
        applyVariantColour,
        creditBadge,
        parseVariantKey,
        setUpEngine,
        variantIcon,
        variantKey,
        variantName,
      } from "./js/variants.js";

      // If the user arrives at index.html with a game hash, forward to game.html
      if (window.location.hash && window.location.hash.length > 1) {
        window.location.href = "game.html" + window.location.hash;
      }

      const engine = new ChessEngine();
      let gm = null;

      // Firebase is only needed for games with a friend, so it's loaded when
      // there are some to show, or one to start or join. That way the variant
      // list and bot games still work if it can't load (e.g. locally without
      // js/firebase-config.js).
      async function ensureInit() {
        if (!gm) {
          const { GameManager } = await import("./js/game-manager.js");
          const manager = new GameManager();
          await manager.init();
          gm = manager;
        }
        return gm;
      }

      function showError(msg) {
        const el = document.getElementById("error-message");
        el.textContent = msg;
        el.hidden = false;
        setTimeout(() => {
          el.hidden = true;
        }, 5000);
      }

      // ---- Variant list ----

      const optionsEl = document.getElementById("variant-options");
      for (const variant of VARIANTS) {
        const label = document.createElement("label");
        label.className = "variant-option";
        label.dataset.variant = variant.id;
        applyVariantColour(label, variant);

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "variant";
        input.value = variant.id;
        input.id = `variant-${variant.id}`;

        const text = document.createElement("span");
        text.className = "variant-option__text";
        const name = document.createElement("span");
        name.className = "variant-option__name";
        const nameText = document.createElement("strong");
        nameText.textContent = variant.name;
        name.append(nameText, creditBadge(variant) ?? "");
        const tagline = document.createElement("small");
        tagline.textContent = variant.tagline;
        text.append(name, tagline);

        label.append(input, variantIcon(variant), text);
        optionsEl.appendChild(label);
      }

      // A link like ./?variant=risky-960 (from the game page's breadcrumb)
      // opens with that variant chosen
      const requested = new URLSearchParams(window.location.search).get("variant");
      let initial = null;
      if (requested) {
        try {
          initial = parseVariantKey(requested);
        } catch {
          // Unknown variant in the link: keep the default
        }
      }

      // The variant, who you play, which colour and Chess960 are remembered for
      // next time. A link with a variant still decides the variant and Chess960,
      // as it names the exact game.
      const SETTINGS_KEY = "chess-new-game-settings";
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)) ?? {};
      } catch {
        // No storage, or nothing sensible saved: use the defaults
      }

      const checkIfExists = (id) => {
        const input = document.getElementById(id);
        if (input) input.checked = true;
      };
      // A saved variant that no longer exists leaves the first one chosen
      checkIfExists(`variant-${VARIANTS[0].id}`);
      checkIfExists(`variant-${initial ? initial.variant.id : saved.variant}`);
      checkIfExists(`opponent-${saved.opponent}`);
      checkIfExists(`color-${saved.colour}`);
      document.getElementById("chess960").checked = initial ? initial.is960 : saved.chess960 === true;

      function saveSettings() {
        const data = new FormData(document.getElementById("new-game"));
        try {
          localStorage.setItem(
            SETTINGS_KEY,
            JSON.stringify({
              variant: data.get("variant"),
              opponent: data.get("opponent"),
              colour: data.get("colour"),
              chess960: document.getElementById("chess960").checked,
            })
          );
        } catch {
          // Storage is full or blocked: the form still works, it just won't remember
        }
      }

      // ---- Keep the rules and the start button in step with the form ----

      const form = document.getElementById("new-game");

      function currentChoice() {
        const data = new FormData(form);
        return {
          key: variantKey(data.get("variant"), document.getElementById("chess960").checked),
          opponent: data.get("opponent"),
          colour: data.get("colour"),
        };
      }

      function update() {
        const { key, opponent } = currentChoice();
        const { variant, is960 } = parseVariantKey(key);

        document.getElementById("btn-start").textContent =
          `Start ${variantName(key)} against ${opponent === "bot" ? "the bot" : "a friend"}`;

        const rules = document.getElementById("rules");
        applyVariantColour(rules, variant);
        document.getElementById("rules-title").replaceChildren(variant.name, creditBadge(variant) ?? "");
        document.getElementById("rules-text").innerHTML = `<p>${variant.rules}</p>`;

        const screenshot = document.getElementById("rules-screenshot");
        screenshot.src = variant.screenshot;
        screenshot.alt = `${variant.name} screenshot`;

        const rules960 = document.getElementById("rules-960");
        rules960.innerHTML = `<span><strong>Chess960:</strong> ${CHESS960_RULES}</span>`;
        rules960.hidden = !is960;
      }

      form.addEventListener("change", () => {
        update();
        saveSettings();
      });
      update();

      // ---- Start a game ----

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const { key, opponent, colour } = currentChoice();
        const color = colour === "random" ? (Math.random() < 0.5 ? "white" : "black") : colour;

        if (opponent === "bot") {
          // The code at the end lets the game page save the game, so you can come back to it
          const code = crypto.randomUUID().slice(0, 8);
          window.location.href = `game.html#bot:${key}:${color}:${code}`;
          return;
        }

        const startButton = document.getElementById("btn-start");
        startButton.disabled = true;
        try {
          const games = await ensureInit();
          const gameId = await games.createGame(key, color);
          setUpEngine(engine, key);
          await games.sendGameState(engine.serialize());

          localStorage.setItem("chess-color-" + gameId, color);
          localStorage.setItem("chess-creator-" + gameId, "1");
          window.location.href = "game.html#" + gameId;
        } catch (err) {
          startButton.disabled = false;
          showError("Failed to create game: " + err.message);
        }
      });

      // ---- Join a game ----

      document.getElementById("join-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const gameId = document.getElementById("game-id-input").value.trim().toLowerCase();
        if (!gameId) {
          showError("Please enter a game code");
          return;
        }
        try {
          const games = await ensureInit();
          // You get whichever colour is free, which isn't always black
          const colour = await games.joinGame(gameId);
          localStorage.setItem("chess-color-" + gameId, colour);
          window.location.href = "game.html#" + gameId;
        } catch (err) {
          showError(err.message);
        }
      });

      // ---- Your games ----

      const DAY = 24 * 60 * 60 * 1000;

      // A game where someone still hasn't made their first move a day after
      // anything last happened probably never got going (a link that didn't
      // reach the other person, say), so it's left out of the list
      function neverStarted(moveCount, lastActivity) {
        return moveCount < 2 && Date.now() - lastActivity > DAY;
      }

      const moveCount = (state) => Object.values(state?.moveHistory ?? {}).length;

      // Bot games are saved in local storage by the game page (chess-bot-<code>).
      // Finished ones are left out, and forgotten a day after they ended. So are
      // ones that never started, and ones you remove from the list.
      function savedBotGames() {
        const rows = [];
        for (const storageKey of Object.keys(localStorage)) {
          if (!storageKey.startsWith("chess-bot-")) continue;
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem(storageKey));
            parseVariantKey(saved.variant);
          } catch {
            continue; // Not readable, or a variant that no longer exists
          }
          const { variant, colour, state, updatedAt } = saved;
          if (state.gameOver) {
            if (Date.now() - updatedAt > DAY) localStorage.removeItem(storageKey);
            continue;
          }
          if (neverStarted(moveCount(state), updatedAt)) {
            localStorage.removeItem(storageKey);
            continue;
          }
          const yourMove = state.turn === colour;
          rows.push({
            href: `game.html#bot:${variant}:${colour}:${storageKey.slice("chess-bot-".length)}`,
            key: variant,
            detail: `Playing as ${colour} against the bot`,
            status: yourMove ? "Your move" : "Bot's move",
            yourMove,
            lastMoveAt: updatedAt,
            // It only lives in this browser, so removing it deletes it
            remove: () => localStorage.removeItem(storageKey),
            isBot: true,
          });
        }
        return rows;
      }

      // Every game you've started or joined with a friend leaves its code in
      // local storage (chess-color-<code>, holding your colour). Look each one up
      // and keep the ones still going. Removing one from the list only hides it
      // (chess-hidden-<code>): the game page needs your colour to let you back in.
      async function friendGames() {
        const saved = Object.keys(localStorage)
          .filter((storageKey) => storageKey.startsWith("chess-color-"))
          .filter((storageKey) => !localStorage.getItem("chess-hidden-" + storageKey.slice("chess-color-".length)))
          .map((storageKey) => ({
            id: storageKey.slice("chess-color-".length),
            colour: localStorage.getItem(storageKey),
          }));
        if (saved.length === 0) return [];

        let found;
        try {
          const manager = await ensureInit();
          found = await Promise.all(saved.map(({ id }) => manager.getGame(id).catch(() => null)));
        } catch {
          return []; // Firebase didn't load: just leave them out
        }

        const rows = [];
        saved.forEach(({ id, colour }, i) => {
          const data = found[i];
          if (!data || data.status === "finished" || data.state?.gameOver) return;
          if (neverStarted(moveCount(data.state), data.lastMoveAt ?? data.createdAt ?? 0)) return;
          try {
            parseVariantKey(data.variant);
          } catch {
            return; // A variant that no longer exists
          }
          const yourMove = data.status === "active" && data.state?.turn === colour;
          let status = "Their move";
          if (data.status === "waiting") status = "Waiting for them to join";
          else if (yourMove) status = "Your move";
          rows.push({
            href: `game.html#${id}`,
            key: data.variant,
            detail: `Playing as ${colour} · ${id}`,
            status,
            yourMove,
            lastMoveAt: data.lastMoveAt ?? data.createdAt ?? 0,
            remove: () => localStorage.setItem("chess-hidden-" + id, "1"),
            code: id,
          });
        });
        return rows;
      }

      function showYourGames(rows) {
        // Your move first, then the most recently played
        rows.sort((a, b) => b.yourMove - a.yourMove || b.lastMoveAt - a.lastMoveAt);

        const list = document.getElementById("your-games-list");
        list.replaceChildren(
          ...rows.map((row) => {
            const { variant } = parseVariantKey(row.key);

            const link = document.createElement("a");
            link.className = "klods-list__link";
            link.href = row.href;

            const lead = document.createElement("span");
            lead.className = "klods-list__lead";
            lead.append(variantIcon(variant));

            const content = document.createElement("span");
            content.className = "klods-list__content your-games__text";
            const name = document.createElement("strong");
            name.textContent = variantName(row.key);
            const detail = document.createElement("small");
            detail.textContent = row.detail;
            content.append(name, detail);

            const status = document.createElement("span");
            status.className = row.yourMove ? "klods-status klods-status--success" : "klods-status";
            status.textContent = row.status;
            const trail = document.createElement("span");
            trail.className = "klods-list__trail";
            trail.append(status);

            link.append(lead, content, trail);

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "klods-button klods-button--ghost your-games__remove";
            remove.textContent = "×";
            remove.title = "Remove from your games";
            remove.setAttribute("aria-label", `Remove ${variantName(row.key)}, ${row.detail}, from your games`);
            remove.addEventListener("click", async () => {
              const confirmed = await askToConfirm({
                title: "Remove this game?",
                message: row.isBot
                  ? `Your ${variantName(row.key)} game against the bot will be deleted. You can't undo this.`
                  : `${variantName(row.key)} (${row.code}) will no longer be listed here. You can still open it from its link.`,
                confirmLabel: "Remove",
                cancelLabel: "Keep it",
                danger: true,
              });
              if (!confirmed) return;
              try {
                row.remove();
              } catch {
                // No storage: it'll be back next time, but it goes for now
              }
              botGames = botGames.filter((game) => game !== row);
              item.remove();
              updateYourGamesSummary();
            });

            const item = document.createElement("li");
            item.className = "klods-list__item klods-list__item--link your-games__item";
            if (row.yourMove) item.dataset.yourMove = "";
            item.append(link, remove);
            return item;
          })
        );
        updateYourGamesSummary();
      }

      // The count, and how many games are waiting for your move, so you can
      // tell even with the list folded away
      function updateYourGamesSummary() {
        const list = document.getElementById("your-games-list");
        const games = list.children.length;
        const yourMove = list.querySelectorAll("[data-your-move]").length;
        document.getElementById("your-games").hidden = games === 0;
        document.getElementById("your-games-count").textContent = games;
        const waiting = document.getElementById("your-games-waiting");
        waiting.textContent = yourMove === 1 ? "1 waiting for you" : `${yourMove} waiting for you`;
        waiting.hidden = yourMove === 0;
      }

      // Remember whether the list is open or folded away
      const yourGames = document.getElementById("your-games");
      try {
        if (localStorage.getItem("chess-your-games-open") === "false") yourGames.open = false;
      } catch {
        // No storage: it starts open
      }
      yourGames.addEventListener("toggle", () => {
        try {
          localStorage.setItem("chess-your-games-open", String(yourGames.open));
        } catch {
          // Storage is full or blocked: it just won't remember
        }
      });

      // Bot games show straight away; games with friends join them once
      // Firebase has looked them up
      let botGames = [];
      try {
        botGames = savedBotGames();
      } catch {
        // No storage: there's nothing saved to list
      }
      showYourGames(botGames);
      friendGames()
        .catch(() => [])
        .then((rows) => {
          if (rows.length > 0) showYourGames([...botGames, ...rows]);
        });

      // Register service worker (enables PWA install + push notifications in game.html)
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
