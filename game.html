<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Variants</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4a9eff" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/klods-css@2.2.0/dist/klods.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="page game-page" id="game-page">
      <header class="game-header">
        <nav aria-label="Breadcrumb">
          <ol class="klods-breadcrumb__list">
            <li class="klods-breadcrumb__item">
              <a class="klods-breadcrumb__link" href="index.html">Chess variants</a>
            </li>
            <li class="klods-breadcrumb__item">
              <a class="klods-breadcrumb__link" id="variant-label" href="index.html"></a>
            </li>
            <li class="klods-breadcrumb__item" aria-current="page" id="game-crumb"></li>
          </ol>
        </nav>
        <div id="game-status" class="klods-status" role="status">Connecting…</div>
      </header>

      <div class="game-main">
        <div class="game-main-left">
          <div class="player-bar player-top">
            <span class="player-label" id="opponent-label">Opponent</span>
            <div class="captured-pieces" id="captured-top"></div>
          </div>
          <div class="board-wrapper">
            <div id="chess-board"></div>
          </div>
          <div class="player-bar player-bottom">
            <span class="player-label" id="player-label">You</span>
            <div class="captured-pieces" id="captured-bottom"></div>
          </div>
          <div class="game-controls">
            <button id="btn-flip" class="klods-button" type="button">Flip board</button>
            <button id="btn-draw" class="klods-button" type="button">Offer draw</button>
            <button id="btn-resign" class="klods-button klods-button--danger game-controls__resign" type="button">
              Resign
            </button>
          </div>
          <div id="confirm-move-bar" class="confirm-move-bar" hidden>
            <button id="btn-cancel-move" class="btn-cancel-move" type="button" aria-label="Cancel move">✕</button>
            <button id="btn-confirm-move" class="btn-confirm" type="button" aria-label="Confirm move">✓</button>
          </div>
        </div>
        <div class="game-main-right">
          <section class="klods-card move-history-panel" aria-labelledby="moves-title">
            <div class="klods-card__body">
              <div class="move-history-header">
                <h2 id="moves-title" class="klods-card__title">Moves</h2>
                <div class="review-nav">
                  <button id="btn-review-start" class="klods-button review-btn" type="button" title="First position">
                    ⏮&#xFE0E;
                  </button>
                  <button id="btn-review-prev" class="klods-button review-btn" type="button" title="Previous move">
                    ◀&#xFE0E;
                  </button>
                  <button id="btn-review-next" class="klods-button review-btn" type="button" title="Next move">
                    ▶&#xFE0E;
                  </button>
                  <button id="btn-review-end" class="klods-button review-btn" type="button" title="Live position">
                    ⏭&#xFE0E;
                  </button>
                </div>
              </div>
              <div id="move-list" class="move-list"></div>
            </div>
          </section>

          <details class="klods-details game-rules">
            <summary id="rules-title">How to play</summary>
            <div class="game-rules__text">
              <div id="rules-text"></div>
              <p id="rules-960" hidden></p>
            </div>
          </details>
        </div>
      </div>

      <footer class="site-footer">
        <p class="site-footer__credit">
          Made by <a class="klods-link" href="https://www.druewilding.com/">Drue Wilding</a>
        </p>
        <div class="site-footer__theme">
          <p id="theme-label" class="klods-label">Theme</p>
          <div class="klods-segmented" role="radiogroup" aria-labelledby="theme-label">
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="auto" checked />Auto</label
            >
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="light" />Light</label
            >
            <label class="klods-segmented__option"
              ><input type="radio" class="klods-segmented__input" name="theme" value="dark" />Dark</label
            >
          </div>
        </div>
      </footer>

      <!-- Asks before resigning or offering a draw (see askToConfirm) -->
      <dialog id="confirm-dialog" class="klods-modal" aria-labelledby="confirm-dialog-title">
        <form method="dialog" class="klods-modal__panel">
          <div class="klods-modal__header">
            <h2 id="confirm-dialog-title" class="klods-modal__title"></h2>
          </div>
          <p id="confirm-dialog-message" class="klods-modal__body"></p>
          <div class="klods-modal__actions">
            <button id="confirm-dialog-cancel" class="klods-button" value="cancel" autofocus>Keep playing</button>
            <button id="confirm-dialog-ok" class="klods-button" value="confirm"></button>
          </div>
        </form>
      </dialog>

      <!-- Draw offer banner -->
      <div id="draw-offer-banner" class="draw-offer-banner" role="alert" hidden>
        <span>Your opponent offers a draw.</span>
        <button id="btn-accept-draw" class="klods-button klods-button--primary" type="button">Accept</button>
        <button id="btn-decline-draw" class="klods-button" type="button">Decline</button>
      </div>

      <!-- Waiting for opponent overlay (shown for white before black joins) -->
      <div id="waiting-overlay" class="game-over-overlay" hidden>
        <div class="game-over-content">
          <h2>Waiting for opponent…</h2>
          <p>Share this link:</p>
          <div class="share-link-container">
            <input type="text" id="share-link" class="klods-input" readonly aria-label="Link to this game" />
            <button id="btn-copy-link" class="klods-button" type="button">Copy</button>
          </div>
          <p class="game-code">Code: <strong id="game-code-display"></strong></p>
        </div>
      </div>

      <!-- Game over overlay -->
      <div id="game-over-overlay" class="game-over-overlay" hidden>
        <div class="game-over-content">
          <h2 id="game-over-title">Game Over</h2>
          <p id="game-over-reason"></p>
          <div class="game-over-actions">
            <button id="btn-review-game" class="klods-button" type="button">Review game</button>
            <a id="btn-new-game" href="index.html" class="klods-button klods-button--primary">New game</a>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { ChessEngine } from "./js/chess-engine.js";
      import { ChessUI } from "./js/chess-ui.js";
      import {
        CHESS960_RULES,
        VARIANTS,
        applyVariantColour,
        creditBadge,
        currentEngineFlags,
        setUpEngine,
        variantKey,
        variantName,
      } from "./js/variants.js";

      // --- Hash-based routing: the hash is never sent to the server,
      //     so static hosts (serve, GitHub Pages, etc.) can never strip it.
      const gameId = window.location.hash.slice(1); // e.g. #gjtzu452 → 'gjtzu452'
      const myColorStored = gameId ? localStorage.getItem("chess-color-" + gameId) : null;

      if (!gameId) {
        // No game ID at all — go back to lobby
        window.location.href = "index.html";
      }

      const engine = new ChessEngine();
      // Only expose the engine and board globally in local dev/test environments
      // (Playwright tests and scripts/screenshots.js). Never export them in production
      // to prevent tampering via DevTools or injected scripts.
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        window.engine = engine;
        Object.defineProperty(window, "ui", { get: () => ui });
      }
      // Firebase is only loaded for games with a friend (see initGame), so bot games
      // still work if it can't load (e.g. locally without js/firebase-config.js).
      let gm = null;

      let ui;
      let myColor = myColorStored || null;
      let isMyTurn = false;
      let lastStateJson = "";
      let initialStateLoaded = false; // suppress notification on page load
      let playerJoinedNotified = false; // fire once when opponent joins

      // ---- Position history & move review ----
      let positionSnapshots = []; // snapshots[i] = serialised engine state after i moves
      let reviewIndex = null; // null = live; number = reviewing that snapshot
      let gameVariant = null; // a variant key from js/variants.js, e.g. 'risky' or 'risky-960'
      let lastCaptureInconsistency = null; // tracks last-logged mismatch to avoid console spam

      // Bot mode: hash looks like #bot:iceskate:white:k3x9qd2a or #bot:iceskate-960:black:k3x9qd2a.
      // The code at the end saves the game in local storage (chess-bot-<code>), so it
      // carries on where you left it and the home page can list it. Without a code
      // (e.g. scripts/screenshots.js) it's a fresh game that isn't saved.
      const isBotMode = gameId.startsWith("bot:");
      const botGameCode = isBotMode ? gameId.split(":")[3] : undefined;
      const botStorageKey = botGameCode ? "chess-bot-" + botGameCode : null;

      function loadBotGame() {
        if (!botStorageKey) return null;
        try {
          return JSON.parse(localStorage.getItem(botStorageKey));
        } catch {
          return null;
        }
      }

      function saveBotGame() {
        if (!botStorageKey || positionSnapshots.length === 0) return;
        try {
          localStorage.setItem(
            botStorageKey,
            JSON.stringify({
              variant: gameVariant,
              colour: myColor,
              // The last snapshot is the live game, even while reviewing earlier moves
              state: positionSnapshots[positionSnapshots.length - 1],
              updatedAt: Date.now(),
            })
          );
        } catch {
          // Storage is full or blocked: the game still works, it just won't be saved
        }
      }

      // --- Push notifications ---

      function showNotificationViaSW(title, body, tag) {
        return navigator.serviceWorker.ready.then((reg) => {
          return reg.showNotification(title, {
            body,
            tag,
            renotify: true,
            data: { url: window.location.href },
          });
        });
      }

      function getVariantName() {
        return gameVariant ? variantName(gameVariant) : "Chess Variants";
      }

      function notifyTurn() {
        if (!("Notification" in window)) return;
        if (Notification.permission !== "granted") return;
        if (document.visibilityState === "visible") return;
        showNotificationViaSW(getVariantName(), "It's your turn!", "your-turn").catch((err) =>
          console.error("[notify] showNotification failed:", err)
        );
      }

      function captureSnapshot() {
        return JSON.parse(JSON.stringify(engine.serialize()));
      }

      function buildPositionSnapshots() {
        // Rebuilds from scratch using the live engine (must be at live state with full moveHistory)
        const tempEng = new ChessEngine(currentEngineFlags(engine));
        // Use the engine's actual starting board so Chess960 positions are preserved.
        // engine.startingBoard is always set (standard or 960 layout).
        if (engine.startingBoard) {
          tempEng.reset(JSON.parse(JSON.stringify(engine.startingBoard)));
        }
        // Copy 960 initial king/rook positions so castling logic works correctly
        tempEng.initialKingFile = engine.initialKingFile;
        tempEng.initialRookFiles = engine.initialRookFiles ? { ...engine.initialRookFiles } : null;
        const snaps = [JSON.parse(JSON.stringify(tempEng.serialize()))];
        for (const move of engine.moveHistory) {
          tempEng.makeMove(
            move.from.rank,
            move.from.file,
            move.to.rank,
            move.to.file,
            move.promotion || null,
            move.castling ?? null
          );
          snaps.push(JSON.parse(JSON.stringify(tempEng.serialize())));
        }
        return snaps;
      }

      function syncSnapshots() {
        // Call after engine has been deserialised to the live state.
        const liveMoveCount = engine.moveHistory.length;
        const expectedLength = liveMoveCount + 1;
        if (positionSnapshots.length < expectedLength) {
          if (positionSnapshots.length === expectedLength - 1 && positionSnapshots.length > 1) {
            // Fast path: one snapshot behind and snapshot[0] is already valid.
            // positionSnapshots.length > 1 ensures we're not using the placeholder
            // standard-position snapshot set in initGame() before Firebase data arrived.
            positionSnapshots.push(captureSnapshot());
          } else {
            // Full rebuild — also used on page reload to ensure snapshot[0] reflects
            // the actual starting position (e.g. Chess960 layout, not standard chess).
            positionSnapshots = buildPositionSnapshots();
          }
        } else if (liveMoveCount === 0 && positionSnapshots.length === 1) {
          // 0-move game: update the placeholder snapshot[0] that was captured in
          // initGame() before Firebase data arrived (was standard position).
          positionSnapshots[0] = captureSnapshot();
        }
        // If the game ended without a new move (e.g. agreed draw, resignation via Firebase),
        // update the last snapshot so its gameOver flag is accurate. This ensures Dark Chess
        // board-reveal and move-list unhiding work correctly during review.
        if (
          engine.gameOver &&
          positionSnapshots.length > 0 &&
          !positionSnapshots[positionSnapshots.length - 1].gameOver
        ) {
          positionSnapshots[positionSnapshots.length - 1] = captureSnapshot();
        }
        if (isBotMode) saveBotGame();
      }

      function goToPosition(index) {
        if (index < 0 || index >= positionSnapshots.length) return;

        if (ui.pendingMoveConfirm) {
          ui.cancelPendingMove();
          document.getElementById("confirm-move-bar").hidden = true;
        }

        const fromIndex = reviewIndex !== null ? reviewIndex : positionSnapshots.length - 1;
        const step = index - fromIndex;
        const isLive = index === positionSnapshots.length - 1;

        reviewIndex = index;
        engine.deserialize(positionSnapshots[index]);
        ui.interactive = false;
        // Dark Chess: check live state (not reviewed snapshot) to decide visibility
        const liveGameOver = positionSnapshots.length > 0 && positionSnapshots[positionSnapshots.length - 1].gameOver;
        if (ui.dark) ui.darkRevealed = liveGameOver;
        ui.setLastMove(null);
        ui.clearSelection(); // renders the board
        updateStatus();
        updateMoveList();
        updateCaptured();
        updateReviewNavButtons();

        const afterAnimation = isLive ? exitReview : () => {};

        // Animate single-step transitions
        if (step === 1) {
          // Forward: animate the move just applied
          const snap = positionSnapshots[index];
          const history = Array.isArray(snap.moveHistory) ? snap.moveHistory : Object.values(snap.moveHistory || {});
          if (history.length > 0) {
            const move = history[history.length - 1];
            // Dark Chess: skip enemy animations during review if game is still in progress
            const suppressAnim = ui.dark && !liveGameOver && move.piece.color !== myColor;
            if (!suppressAnim) {
              const pieceType = move.promotion ? move.promotion : move.piece.type;
              ui.animateMove(
                move.from.rank,
                move.from.file,
                move.to.rank,
                move.to.file,
                pieceType,
                move.piece.color,
                afterAnimation
              );
              return;
            }
          }
        } else if (step === -1) {
          // Backward: animate reverse of the undone move
          const snap = positionSnapshots[fromIndex];
          const history = Array.isArray(snap.moveHistory) ? snap.moveHistory : Object.values(snap.moveHistory || {});
          if (history.length > 0) {
            const move = history[history.length - 1];
            // Dark Chess: skip enemy animations during review if game is still in progress
            const suppressAnim = ui.dark && !liveGameOver && move.piece.color !== myColor;
            if (!suppressAnim) {
              ui.animateMove(
                move.to.rank,
                move.to.file,
                move.from.rank,
                move.from.file,
                move.piece.type,
                move.piece.color,
                afterAnimation
              );
              return;
            }
          }
        }

        // No animation (multi-step jump or no history): exit review immediately if at live position
        if (isLive) exitReview();
      }

      function exitReview() {
        reviewIndex = null;
        engine.deserialize(positionSnapshots[positionSnapshots.length - 1]);
        isMyTurn = engine.turn === myColor && !engine.gameOver;
        ui.interactive = isMyTurn;
        if (ui.dark) ui.darkRevealed = engine.gameOver;
        const hist = engine.moveHistory;
        ui.setLastMove(hist.length > 0 ? hist[hist.length - 1] : null);
        ui.clearSelection();
        updateStatus();
        updateMoveList();
        updateCaptured();
        updateReviewNavButtons();
      }

      function updateReviewNavButtons() {
        if (positionSnapshots.length === 0) return;
        const liveIndex = positionSnapshots.length - 1;
        const currentIndex = reviewIndex !== null ? reviewIndex : liveIndex;
        document.getElementById("btn-review-start").disabled = currentIndex === 0;
        document.getElementById("btn-review-prev").disabled = currentIndex === 0;
        document.getElementById("btn-review-next").disabled = currentIndex >= liveIndex;
        document.getElementById("btn-review-end").disabled = currentIndex >= liveIndex;
      }

      // Fill in the breadcrumb, colour and rules for this game's variant.
      // The engine's flags say which variant it is; the variant key says whether it's Chess960.
      function updateVariantDisplay() {
        const variant = VARIANTS.find((v) => engine[v.id]) ?? VARIANTS[0];
        const is960 = Boolean(gameVariant && gameVariant.endsWith("-960"));
        gameVariant = variantKey(variant.id, is960);
        const label = variantName(gameVariant);

        applyVariantColour(document.getElementById("game-page"), variant);

        const labelEl = document.getElementById("variant-label");
        labelEl.textContent = label;
        labelEl.href = `./?variant=${gameVariant}`;
        document.getElementById("btn-new-game").href = `./?variant=${gameVariant}`;
        document.getElementById("game-crumb").textContent = isBotMode ? "Against the bot" : "Against a friend";

        // One span, so the badge stays beside the title in the summary's row
        const rulesTitle = document.createElement("span");
        rulesTitle.append(`How ${label} works`, creditBadge(variant) ?? "");
        document.getElementById("rules-title").replaceChildren(rulesTitle);
        document.getElementById("rules-text").innerHTML = `<p>${variant.rules}</p>`;
        const rules960 = document.getElementById("rules-960");
        rules960.innerHTML = `<strong>Chess960:</strong> ${CHESS960_RULES}`;
        rules960.hidden = !is960;

        document.title = `${label} · Chess Variants`;
      }

      function initBotGame(variant, playerColor) {
        myColor = playerColor;
        gameVariant = variant;

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }

        setUpEngine(engine, variant);
        const saved = loadBotGame();
        const resumed = saved?.variant === variant && saved?.colour === playerColor;
        if (resumed) engine.deserialize(saved.state);
        const isDark = engine.dark;

        updateVariantDisplay();

        const flipped = myColor === "black";
        ui = new ChessUI(document.getElementById("chess-board"), engine, {
          flipped,
          interactive: false, // set below, once we know whose turn it is
          onMove: handleLocalMove,
          confirmMove: true,
          dark: isDark,
          playerColor: myColor,
          onPendingMoveChange: (pending) => {
            document.getElementById("confirm-move-bar").hidden = !pending;
            updateMoveList();
            updateCaptured();
          },
        });

        if (resumed) {
          syncSnapshots(); // rebuilds the snapshots from the saved moves
          const lastMove = engine.moveHistory[engine.moveHistory.length - 1];
          if (lastMove) ui.setLastMove(lastMove);
          if (isDark) ui.darkRevealed = engine.gameOver;
        } else {
          positionSnapshots = [captureSnapshot()];
          saveBotGame();
        }
        isMyTurn = engine.turn === myColor && !engine.gameOver;
        ui.interactive = isMyTurn;
        ui.render();
        updateLabels();
        updateStatus();
        updateMoveList();
        updateCaptured();
        updateReviewNavButtons();

        // Draw offers don't apply vs. bot
        document.getElementById("btn-draw").hidden = true;

        // The bot moves first if you're black, or carries on if you left during its move
        if (!engine.gameOver && !isMyTurn) {
          setTimeout(() => makeBotMove(), 500);
        }
      }

      function makeBotMove() {
        if (engine.gameOver) return;
        const botColor = myColor === "white" ? "black" : "white";
        if (engine.turn !== botColor) return;

        // Fraction of moves played randomly (0 = always scored, 1 = always random)
        const BOT_RANDOM_RATE = 0.3;

        // Piece values for capture scoring
        const PIECE_VALUES = { queen: 9, rook: 5, bishop: 3, knight: 3, pawn: 1, amazon: 13, king: 12 };

        // Collect every legal move for the bot's pieces, scored by desirability:
        //   capture by piece rank: queen=9, rook=5, bishop/knight=3, pawn=1
        //   en passant: 2  |  castling: 4  |  check: 10  |  checkmate: 20
        //   opening bonuses: center landing +2/+1, development +2, pawn 2-sq +1
        //   king non-castling penalty: -3
        //   Superchess: strongly favour pawn advances and promotions
        //   scores stack (e.g. capture queen + check = 19)
        const backRank = botColor === "white" ? 7 : 0;
        const scoredMoves = [];
        for (let rank = 0; rank < 8; rank++) {
          for (let file = 0; file < 8; file++) {
            const piece = engine.getPiece(rank, file);
            if (!piece || piece.color !== botColor) continue;
            const moves = engine.getLegalMoves(rank, file);
            for (const move of moves) {
              // In Superchess, allow Amazon promotion; otherwise, only queen
              if (
                move.promotion &&
                ((gameVariant.startsWith("superchess") && move.promotion !== "amazon" && move.promotion !== "queen") ||
                  (!gameVariant.startsWith("superchess") && move.promotion !== "queen"))
              )
                continue;

              let score = 0;

              // Normal capture (target square occupied by opponent)
              const target = engine.getPiece(move.rank, move.file);
              if (target) {
                if (target.color === botColor) {
                  // Friendly capture (angry chess) — penalize
                  score -= PIECE_VALUES[target.type] || 0;
                } else {
                  score += PIECE_VALUES[target.type] || 0;
                }
              }

              // En passant — destination square is empty, but a pawn is captured
              if (move.enPassant) score += 2;

              // Castling
              if (move.castling) score += 4;

              // Check / checkmate
              const preview = engine.previewMoveResult(
                rank,
                file,
                move.rank,
                move.file,
                move.promotion || null,
                move.castling
              );
              if (preview.checkmate) score += 20;
              else if (preview.check) score += 10;

              // Risky Chess: big bonus for capturing the opponent's king
              if (preview.kingCapture) score += 20;

              // --- Opening / positional heuristics ---

              // Center control: d4/e4/d5/e5 = +2, extended center (c3–f6 ring) = +1
              const toR = move.rank,
                toF = move.file;
              const inCenter = (toR === 3 || toR === 4) && (toF === 3 || toF === 4);
              const inExtended = toR >= 2 && toR <= 5 && toF >= 2 && toF <= 5;
              if (inCenter) score += 2;
              else if (inExtended) score += 1;

              // Prefer pawn two-square advance over one square
              if (piece.type === "pawn" && Math.abs(move.rank - rank) === 2) score += 1;

              // --- Superchess: strongly favour pawn advances and promotions ---
              if (gameVariant.startsWith("superchess") && piece.type === "pawn") {
                // Bonus for advancing pawns closer to promotion
                // For white: ranks 6,5,4,3 (from 6 to 0 is promotion)
                // For black: ranks 1,2,3,4 (from 1 to 7 is promotion)
                let advanceBonus = 0;
                if (botColor === "white") {
                  if (rank > move.rank) {
                    // moving forward
                    if (move.rank === 0)
                      advanceBonus += 12; // promotion square
                    else if (move.rank === 1) advanceBonus += 6;
                    else if (move.rank === 2) advanceBonus += 4;
                    else if (move.rank === 3) advanceBonus += 2;
                    else if (move.rank === 4) advanceBonus += 1;
                  }
                } else {
                  if (rank < move.rank) {
                    // moving forward
                    if (move.rank === 7)
                      advanceBonus += 12; // promotion square
                    else if (move.rank === 6) advanceBonus += 6;
                    else if (move.rank === 5) advanceBonus += 4;
                    else if (move.rank === 4) advanceBonus += 2;
                    else if (move.rank === 3) advanceBonus += 1;
                  }
                }
                score += advanceBonus;
                // Extra bonus for actual promotion
                if (move.promotion === "amazon") score += 20;
                else if (move.promotion === "queen") score += 14;
                else if (move.promotion) score += 10;
              }

              // Reward developing knights and bishops off the back rank
              if (piece.type === "knight" && rank === backRank) score += 1;
              if (piece.type === "bishop" && rank === backRank) score += 2;

              // Discourage pointless king walks (castling already rewarded above)
              if (piece.type === "king" && !move.castling) score -= 3;

              scoredMoves.push({
                fromRank: rank,
                fromFile: file,
                toRank: move.rank,
                toFile: move.file,
                score,
                castling: move.castling || null,
                promotion: move.promotion || null,
              });
            }
          }
        }

        if (scoredMoves.length === 0) return; // already checkmate/stalemate — engine handles it

        // BOT_RANDOM_RATE of the time: ignore scoring and pick any legal move at random
        // Otherwise: pick the highest-scoring move, breaking ties randomly
        // For random selection, exclude moves with negative scores (e.g. friendly captures in Angry Chess)
        const nonNegativeMoves = scoredMoves.filter((m) => m.score >= 0);
        const randomPool = nonNegativeMoves.length > 0 ? nonNegativeMoves : scoredMoves;
        let chosen;
        if (Math.random() < BOT_RANDOM_RATE) {
          chosen = randomPool[Math.floor(Math.random() * randomPool.length)];
        } else {
          const maxScore = Math.max(...scoredMoves.map((m) => m.score));
          const bestMoves = scoredMoves.filter((m) => m.score === maxScore);
          chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        // Detect pawn promotion; use the move's promotion property (already filtered above)
        const movingPiece = engine.getPiece(chosen.fromRank, chosen.fromFile);
        let promotion = null;
        if (movingPiece && movingPiece.type === "pawn") {
          if ((botColor === "white" && chosen.toRank === 0) || (botColor === "black" && chosen.toRank === 7)) {
            promotion = chosen.promotion || null;
          }
        }

        engine.makeMove(
          chosen.fromRank,
          chosen.fromFile,
          chosen.toRank,
          chosen.toFile,
          promotion,
          chosen.castling ?? null
        );
        syncSnapshots();

        isMyTurn = engine.turn === myColor && !engine.gameOver;
        ui.interactive = isMyTurn;

        const lastMove = engine.moveHistory[engine.moveHistory.length - 1];
        ui.setLastMove(lastMove);
        ui.render();

        // In Dark Chess, skip bot move animation so we don't reveal the move
        if (!engine.dark) {
          const pieceType = lastMove.promotion ? lastMove.promotion : lastMove.piece.type;
          ui.animateMove(
            lastMove.from.rank,
            lastMove.from.file,
            lastMove.to.rank,
            lastMove.to.file,
            pieceType,
            lastMove.piece.color,
            () => {}
          );
        }

        updateStatus();
        updateMoveList();
        updateCaptured();
        updateReviewNavButtons();

        if (engine.gameOver) showGameOver();
      }

      async function initGame() {
        if (isBotMode) {
          const [, variant, playerColor] = gameId.split(":"); // the 4th part is botGameCode
          initBotGame(variant, playerColor);
          return;
        }

        const { GameManager } = await import("./js/game-manager.js");
        gm = new GameManager();
        await gm.init();

        // Register service worker (needed for push + PWA install prompt)
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }

        // Ask for notification permission. Browsers show the native prompt;
        // if the user dismisses it they can re-enable from browser settings.
        if ("Notification" in window && Notification.permission === "default") {
          await Notification.requestPermission();
        }

        const statusEl = document.getElementById("game-status");
        statusEl.textContent = "Connecting…";

        // If we don't have a stored color, try to join as the available color
        if (!myColor) {
          try {
            await gm.joinGame(gameId);
            myColor = gm.playerColor;
            localStorage.setItem("chess-color-" + gameId, myColor);
          } catch (err) {
            statusEl.textContent = err.message;
            return;
          }
        }

        // Set up the Firebase game reference
        gm.gameId = gameId;
        gm.playerColor = myColor;
        gm.gameRef = gm._fb.ref(gm.db, `games/${gameId}`);

        // Register this device's FCM token so the Cloud Function can push to us
        if ("Notification" in window && Notification.permission === "granted") {
          gm.registerFCMToken(myColor);
        }

        // Build the UI
        const flipped = myColor === "black";
        ui = new ChessUI(document.getElementById("chess-board"), engine, {
          flipped,
          interactive: false,
          onMove: handleLocalMove,
          confirmMove: true,
          playerColor: myColor,
          onPendingMoveChange: (pending) => {
            document.getElementById("confirm-move-bar").hidden = !pending;
            updateMoveList();
            updateCaptured();
          },
        });
        updateLabels();
        positionSnapshots = [captureSnapshot()];
        updateReviewNavButtons();
        updateGameOverButtons();

        // Show waiting overlay for the creator while opponent hasn't joined yet
        if (localStorage.getItem("chess-creator-" + gameId)) {
          const shareLink = gm.getShareLink();
          document.getElementById("share-link").value = shareLink;
          document.getElementById("game-code-display").textContent = gameId;
          document.getElementById("waiting-overlay").hidden = false;

          document.getElementById("btn-copy-link").addEventListener("click", () => {
            navigator.clipboard.writeText(shareLink).then(() => {
              document.getElementById("btn-copy-link").textContent = "Copied!";
              setTimeout(() => {
                document.getElementById("btn-copy-link").textContent = "Copy";
              }, 2000);
            });
          });
        }

        // Set up Firebase callbacks BEFORE starting the listener
        gm.onGameStateChanged = (state, fullData) => {
          try {
            if (fullData.drawOffer && fullData.drawOffer !== myColor) {
              const banner = document.getElementById("draw-offer-banner");
              if (banner.hidden) {
                // Banner was previously hidden — this is a new draw offer
                if (
                  "Notification" in window &&
                  Notification.permission === "granted" &&
                  document.visibilityState !== "visible"
                ) {
                  showNotificationViaSW(getVariantName(), "Your opponent offers a draw.", "draw-offer").catch((err) =>
                    console.error("[notify] showNotification failed:", err)
                  );
                }
              }
              banner.hidden = false;
            } else {
              document.getElementById("draw-offer-banner").hidden = true;
            }

            const stateJson = JSON.stringify(state);
            if (stateJson === lastStateJson) return;
            lastStateJson = stateJson;

            const prevMoveCount = engine.moveHistory.length;

            // Always load the live state to build snapshots
            engine.deserialize(state);
            syncSnapshots();
            updateGameOverButtons();

            // Update variant display on first load (flags come from deserialized state)
            if (!initialStateLoaded) {
              if (fullData.variant) gameVariant = fullData.variant;
              updateVariantDisplay();
              if (ui) ui.dark = engine.dark;
            }

            if (reviewIndex !== null) {
              // In review mode: update snapshots & isMyTurn but restore the review position
              isMyTurn = engine.turn === myColor && !engine.gameOver;
              engine.deserialize(positionSnapshots[reviewIndex]);
              updateMoveList();
              updateReviewNavButtons();
              return;
            }

            isMyTurn = engine.turn === myColor && !engine.gameOver;
            ui.interactive = isMyTurn;

            // Cancel any stale pending confirm
            if (ui.pendingMoveConfirm) {
              ui.cancelPendingMove();
              document.getElementById("confirm-move-bar").hidden = true;
            }

            const newMoveCount = engine.moveHistory.length;
            const isOpponentMove =
              newMoveCount === prevMoveCount + 1 && engine.moveHistory[newMoveCount - 1].piece.color !== myColor;

            // Notify the player — but not on the initial page load/refresh
            if (isOpponentMove && initialStateLoaded) notifyTurn();
            initialStateLoaded = true;

            // For the opponent's latest move, render first (piece appears at dest),
            // then slide a ghost from source → dest on top.
            // In Dark Chess, skip the animation so we don't reveal opponent moves.
            if (isOpponentMove) {
              const lastMove = engine.moveHistory[newMoveCount - 1];
              ui.setLastMove(lastMove);
              ui.render();
              updateStatus();
              updateMoveList();
              updateCaptured();
              if (!engine.dark) {
                ui.animateMove(
                  lastMove.from.rank,
                  lastMove.from.file,
                  lastMove.to.rank,
                  lastMove.to.file,
                  lastMove.piece.type,
                  lastMove.piece.color,
                  () => {}
                );
              }
            } else {
              if (engine.moveHistory.length > 0) {
                ui.setLastMove(engine.moveHistory[engine.moveHistory.length - 1]);
              }
              ui.render();
              updateStatus();
              updateMoveList();
              updateCaptured();
            }

            updateReviewNavButtons();
            if (engine.gameOver) showGameOver();
          } catch (err) {
            console.error("Error applying game state:", err, state);
          }
        };

        gm.onPlayerJoined = (data) => {
          if (data.status === "active") {
            // Opponent joined — hide the waiting overlay
            document.getElementById("waiting-overlay").hidden = true;
            statusEl.textContent = "";
            updateStatus();

            // Notify white that the game has started and it's their turn
            if (myColor === "white" && !playerJoinedNotified) {
              playerJoinedNotified = true;
              if (
                "Notification" in window &&
                Notification.permission === "granted" &&
                document.visibilityState !== "visible"
              ) {
                showNotificationViaSW(getVariantName(), "Game on! It's your turn.", "your-turn").catch((err) =>
                  console.error("[notify] showNotification failed:", err)
                );
              }
            }
          }
        };

        // NOW start listening — callbacks are guaranteed to be set above
        gm.listenForChanges();
      }

      function handleLocalMove(moveData) {
        syncSnapshots(); // engine already has the new move applied

        if (isBotMode) {
          isMyTurn = false;
          ui.interactive = false;
          updateStatus();
          updateMoveList();
          updateCaptured();
          updateReviewNavButtons();
          if (engine.gameOver) {
            showGameOver();
          } else {
            setTimeout(() => makeBotMove(), 400);
          }
          return;
        }

        // Player made a move locally, send to Firebase
        gm.sendGameState(engine.serialize());
        isMyTurn = false;
        ui.interactive = false;
        updateStatus();
        updateMoveList();
        updateCaptured();
        updateReviewNavButtons();

        if (engine.gameOver) {
          showGameOver();
        }
      }

      function updateStatus() {
        const statusEl = document.getElementById("game-status");
        if (reviewIndex !== null) {
          const liveIndex = positionSnapshots.length - 1;
          statusEl.textContent = `Move ${reviewIndex} / ${liveIndex}`;
          statusEl.className = "klods-status klods-status--info";
          updateGameOverButtons();
          return;
        }
        if (engine.gameOver) {
          // Keep the result in view after the game over overlay is closed
          if (engine.result === "draw") {
            statusEl.textContent = "Draw";
            statusEl.className = "klods-status";
          } else if (engine.result === myColor) {
            statusEl.textContent = "You won";
            statusEl.className = "klods-status klods-status--success";
          } else {
            statusEl.textContent = engine.resultReason === "resignation" ? "You resigned" : "You lost";
            statusEl.className = "klods-status klods-status--danger";
          }
          updateGameOverButtons();
          return;
        }
        if (isMyTurn) {
          statusEl.textContent = "Your turn";
          statusEl.className = "klods-status klods-status--success klods-status--pulse";
        } else {
          statusEl.textContent = isBotMode ? "Bot's turn…" : "Opponent's turn";
          statusEl.className = "klods-status";
        }
        updateGameOverButtons();
      }

      function updateGameOverButtons() {
        const resignBtn = document.getElementById("btn-resign");
        const drawBtn = document.getElementById("btn-draw");
        if (!resignBtn || !drawBtn) return;
        resignBtn.disabled = engine.gameOver;
        drawBtn.disabled = engine.gameOver;
      }

      function updateLabels() {
        const playerLabel = document.getElementById("player-label");
        const opponentLabel = document.getElementById("opponent-label");
        playerLabel.textContent = `You (${myColor})`;
        opponentLabel.textContent = isBotMode
          ? `Bot (${myColor === "white" ? "black" : "white"})`
          : `Opponent (${myColor === "white" ? "black" : "white"})`;
      }

      function updateMoveList() {
        const moveList = document.getElementById("move-list");
        moveList.innerHTML = "";

        // Always show the full game history (from the latest snapshot)
        const liveIndex = positionSnapshots.length - 1;
        const currentPosition = reviewIndex !== null ? reviewIndex : liveIndex;

        let history;
        if (positionSnapshots.length > 0) {
          const h = positionSnapshots[liveIndex].moveHistory;
          history = Array.isArray(h) ? h : Object.values(h || {});
        } else {
          history = engine.moveHistory;
        }

        // Dark Chess: blur opponent moves while the game is still in progress
        // Check live state, not the reviewed snapshot, to decide visibility
        const liveGameOver = positionSnapshots.length > 0 && positionSnapshots[liveIndex].gameOver;
        const isDarkLive = engine.dark && !liveGameOver;

        for (let i = 0; i < history.length; i += 2) {
          const moveNum = Math.floor(i / 2) + 1;
          const row = document.createElement("div");
          row.className = "move-row";

          const numSpan = document.createElement("span");
          numSpan.className = "move-number";
          numSpan.textContent = `${moveNum}.`;
          row.appendChild(numSpan);

          const whiteMove = document.createElement("span");
          whiteMove.className = "move-notation";
          whiteMove.textContent = engine.getMoveNotation(history[i]);
          if (isDarkLive && myColor === "black") whiteMove.classList.add("move-notation--dark-hidden");
          if (currentPosition === i + 1) whiteMove.classList.add("current-move");
          const wi = i + 1;
          whiteMove.addEventListener("click", () => goToPosition(wi));
          row.appendChild(whiteMove);

          if (history[i + 1]) {
            const blackMove = document.createElement("span");
            blackMove.className = "move-notation";
            blackMove.textContent = engine.getMoveNotation(history[i + 1]);
            if (isDarkLive && myColor === "white") blackMove.classList.add("move-notation--dark-hidden");
            if (currentPosition === i + 2) blackMove.classList.add("current-move");
            const bi = i + 2;
            blackMove.addEventListener("click", () => goToPosition(bi));
            row.appendChild(blackMove);
          }

          moveList.appendChild(row);
        }

        // Show pending (preview) move notation faded at the end of the list
        if (ui && ui.pendingMoveConfirm && reviewIndex === null) {
          const { fromRank, fromFile, toRank, toFile, castling, enPassant, promotion } = ui.pendingMoveConfirm;
          const piece = engine.getPiece(fromRank, fromFile);
          if (piece) {
            const capturedPiece = enPassant ? engine.getPiece(fromRank, toFile) : engine.getPiece(toRank, toFile);
            const isFriendlyCapture = capturedPiece && capturedPiece.color === piece.color;
            const { check, checkmate, stalemate, draw, kingCapture } = engine.previewMoveResult(
              fromRank,
              fromFile,
              toRank,
              toFile,
              promotion || null,
              castling !== undefined ? castling : undefined
            );
            const pendingMoveData = {
              piece,
              from: { rank: fromRank, file: fromFile },
              to: { rank: toRank, file: toFile },
              captured: capturedPiece,
              castling: castling || null,
              enPassant: enPassant || false,
              friendlyCapture: isFriendlyCapture || false,
              promotion: promotion || null,
              check,
              checkmate,
              stalemate,
              draw,
              kingCapture,
              disambiguation: engine.computeDisambiguation(fromRank, fromFile, toRank, toFile, piece),
            };
            const pendingNotation = engine.getMoveNotation(pendingMoveData);
            const pendingSpan = document.createElement("span");
            pendingSpan.className = "move-notation move-notation--pending";
            pendingSpan.textContent = pendingNotation;

            if (history.length % 2 === 0) {
              const moveNum = history.length / 2 + 1;
              const row = document.createElement("div");
              row.className = "move-row";
              const numSpan = document.createElement("span");
              numSpan.className = "move-number";
              numSpan.textContent = `${moveNum}.`;
              row.appendChild(numSpan);
              row.appendChild(pendingSpan);
              moveList.appendChild(row);
            } else {
              const lastRow = moveList.lastChild;
              if (lastRow) lastRow.appendChild(pendingSpan);
            }
          }
        }

        // Scroll to current move when reviewing; otherwise scroll to bottom
        if (reviewIndex !== null) {
          const currentEl = moveList.querySelector(".current-move");
          if (currentEl) {
            const listRect = moveList.getBoundingClientRect();
            const elRect = currentEl.getBoundingClientRect();
            if (elRect.top < listRect.top) {
              moveList.scrollTop -= listRect.top - elRect.top;
            } else if (elRect.bottom > listRect.bottom) {
              moveList.scrollTop += elRect.bottom - listRect.bottom;
            }
          }
        } else {
          moveList.scrollTop = moveList.scrollHeight;
        }
      }

      function updateCaptured() {
        // Top = opponent's captures, Bottom = our captures
        const topEl = document.getElementById("captured-top");
        const bottomEl = document.getElementById("captured-bottom");

        if (myColor === "white") {
          ui.updateCapturedPieces(bottomEl, topEl);
        } else {
          ui.updateCapturedPieces(topEl, bottomEl);
        }

        // Sanity-check: the capture-pen material advantage must equal the board
        // material advantage at all times. If they diverge, display a warning.
        // Skip the check while a move is being previewed (pending confirm), but
        // also clear any pre-existing warning so it doesn't linger during preview.
        const warningId = "capture-inconsistency-warning";
        let warningEl = document.getElementById(warningId);
        if (ui.pendingMoveConfirm) {
          if (warningEl) warningEl.remove();
        } else {
          const pieceValues = { pawn: 1, knight: 3, bishop: 3, rook: 5, queen: 9, amazon: 13, king: 12 };
          let whiteBoard = 0,
            blackBoard = 0;
          for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
              const p = engine.board[r][f];
              if (!p) continue;
              const v = pieceValues[p.type] || 0;
              if (p.color === "white") whiteBoard += v;
              else blackBoard += v;
            }
          }
          const boardAdvantage = whiteBoard - blackBoard;
          let whitePen = 0,
            blackPen = 0;
          for (const t of engine.capturedPieces.white) whitePen += pieceValues[t] || 0;
          for (const t of engine.capturedPieces.black) blackPen += pieceValues[t] || 0;
          const penAdvantage = whitePen - blackPen;

          if (boardAdvantage !== penAdvantage) {
            if (!warningEl) {
              warningEl = document.createElement("div");
              warningEl.id = warningId;
              warningEl.className = "capture-inconsistency-warning";
            }
            warningEl.textContent = `Capture pens are wrong (board ${boardAdvantage > 0 ? "+" : ""}${boardAdvantage}, pens ${penAdvantage > 0 ? "+" : ""}${penAdvantage})`;
            document.querySelector(".game-main").prepend(warningEl);
            const mismatchKey = `${boardAdvantage}/${penAdvantage}/${engine.moveHistory.length}`;
            if (lastCaptureInconsistency !== mismatchKey) {
              lastCaptureInconsistency = mismatchKey;
              console.error("[capture-pen] inconsistency detected", {
                boardAdvantage,
                penAdvantage,
                capturedWhite: [...engine.capturedPieces.white],
                capturedBlack: [...engine.capturedPieces.black],
                moveCount: engine.moveHistory.length,
              });
            }
          } else {
            lastCaptureInconsistency = null;
            if (warningEl) warningEl.remove();
          }
        }
      }

      function showGameOver() {
        updateStatus();
        if (ui && ui.dark) {
          ui.darkRevealed = true;
          ui.render();
        }
        const overlay = document.getElementById("game-over-overlay");
        const title = document.getElementById("game-over-title");
        const reason = document.getElementById("game-over-reason");

        overlay.hidden = false;

        let titleText, reasonText;
        if (engine.result === "draw") {
          titleText = "Draw";
          reasonText = engine.resultReason ? `by ${engine.resultReason}` : "";
        } else if (engine.result === myColor) {
          titleText = "You Win!";
          reasonText = engine.resultReason ? `by ${engine.resultReason}` : "";
        } else {
          titleText = "You Lose";
          // Flip "ahead" to "behind" for the loser's perspective
          const r = engine.resultReason || "";
          reasonText = r
            ? `by ${r.replace("points ahead", "points behind").replace("point ahead", "point behind")}`
            : "";
        }

        title.textContent = titleText;
        reason.textContent = reasonText;

        updateGameOverButtons();
        notifyGameOver(titleText, reasonText);
      }

      function notifyGameOver(titleText, reasonText) {
        if (!("Notification" in window)) return;
        if (Notification.permission !== "granted") return;
        if (document.visibilityState === "visible") return;
        const body = reasonText ? `${reasonText}` : "The game has ended.";
        showNotificationViaSW(getVariantName() + " — " + titleText, body, "game-over").catch((err) =>
          console.error("[notify] showNotification failed:", err)
        );
      }

      /**
       * Ask the player to confirm something, in the page's own dialog.
       * Resolves true if they confirm; false if they keep playing, press Esc or
       * click outside the dialog.
       */
      function askToConfirm({ title, message, confirmLabel, danger = false }) {
        const dialog = document.getElementById("confirm-dialog");
        document.getElementById("confirm-dialog-title").textContent = title;
        document.getElementById("confirm-dialog-message").textContent = message;
        const ok = document.getElementById("confirm-dialog-ok");
        ok.textContent = confirmLabel;
        ok.className = `klods-button ${danger ? "klods-button--danger" : "klods-button--primary"}`;

        return new Promise((resolve) => {
          dialog.returnValue = "";
          dialog.addEventListener("close", () => resolve(dialog.returnValue === "confirm"), { once: true });
          dialog.showModal();
        });
      }

      // Clicking the backdrop (outside the panel) closes the dialog
      document.getElementById("confirm-dialog").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) event.currentTarget.close("cancel");
      });

      // Control buttons
      document.getElementById("btn-resign").addEventListener("click", async () => {
        if (engine.gameOver) return;
        const confirmed = await askToConfirm({
          title: "Resign this game?",
          message: `${isBotMode ? "The bot" : "Your opponent"} wins. You can't undo this.`,
          confirmLabel: "Resign",
          danger: true,
        });
        if (confirmed && !engine.gameOver) {
          if (isBotMode) {
            // While reviewing, engine holds an earlier position: go back to the
            // live one, and mark its snapshot as over so going back to it after
            // reviewing still shows the result
            if (reviewIndex !== null) exitReview();
            engine.gameOver = true;
            engine.result = myColor === "white" ? "black" : "white";
            engine.resultReason = "resignation";
            isMyTurn = false;
            ui.interactive = false;
            syncSnapshots();
            showGameOver();
          } else {
            gm.sendResignation(myColor);
          }
        }
      });

      document.getElementById("btn-draw").addEventListener("click", async () => {
        if (engine.gameOver) return;
        const confirmed = await askToConfirm({
          title: "Offer a draw?",
          message: "If your opponent accepts, the game ends in a draw.",
          confirmLabel: "Offer draw",
        });
        if (confirmed && !engine.gameOver) {
          gm.offerDraw(myColor);
          document.getElementById("game-status").textContent = "Draw offered…";
        }
      });

      document.getElementById("btn-accept-draw").addEventListener("click", () => {
        gm.acceptDraw();
      });

      document.getElementById("btn-decline-draw").addEventListener("click", () => {
        gm.declineDraw();
        document.getElementById("draw-offer-banner").hidden = true;
      });

      document.getElementById("btn-review-game").addEventListener("click", () => {
        document.getElementById("game-over-overlay").hidden = true;
      });

      document.getElementById("btn-flip").addEventListener("click", () => {
        ui.setFlipped(!ui.flipped);
      });

      // Confirm move
      document.getElementById("btn-confirm-move").addEventListener("click", () => {
        ui.confirmPendingMove();
      });
      document.getElementById("btn-cancel-move").addEventListener("click", () => {
        ui.cancelPendingMove();
        document.getElementById("confirm-move-bar").hidden = true;
      });

      // Review navigation
      document.getElementById("btn-review-start").addEventListener("click", () => {
        goToPosition(0);
      });
      document.getElementById("btn-review-prev").addEventListener("click", () => {
        const liveIndex = positionSnapshots.length - 1;
        const cur = reviewIndex !== null ? reviewIndex : liveIndex;
        goToPosition(cur - 1);
      });
      document.getElementById("btn-review-next").addEventListener("click", () => {
        const liveIndex = positionSnapshots.length - 1;
        const cur = reviewIndex !== null ? reviewIndex : liveIndex;
        goToPosition(cur + 1);
      });
      document.getElementById("btn-review-end").addEventListener("click", () => {
        exitReview();
      });

      // Keyboard: left/right arrows navigate review; Enter/Escape for move confirm
      document.addEventListener("keydown", (e) => {
        if (ui && ui.pendingMoveConfirm) {
          if (e.key === "Enter") {
            e.preventDefault();
            ui.confirmPendingMove();
            return;
          } else if (e.key === "Escape") {
            e.preventDefault();
            ui.cancelPendingMove();
            document.getElementById("confirm-move-bar").hidden = true;
            return;
          }
        }
        if (e.key === "ArrowLeft") {
          const liveIndex = positionSnapshots.length - 1;
          const cur = reviewIndex !== null ? reviewIndex : liveIndex;
          if (cur > 0) goToPosition(cur - 1);
        } else if (e.key === "ArrowRight") {
          const liveIndex = positionSnapshots.length - 1;
          const cur = reviewIndex !== null ? reviewIndex : liveIndex;
          if (cur < liveIndex) goToPosition(cur + 1);
        }
      });

      // Start
      initGame().catch((err) => {
        console.error("Failed to initialize game:", err);
        document.getElementById("game-status").textContent = "Failed to connect. Check your Firebase config.";
      });
    </script>
  </body>
</html>
